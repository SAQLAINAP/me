<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-speech-spam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#a855f7"/>
      <stop offset="1"   stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid-speech-spam" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-speech-spam" cx="50%" cy="45%" r="55%">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="500" fill="url(#g-speech-spam)"/>
  <rect width="800" height="500" fill="url(#grid-speech-spam)"/>
  <rect width="800" height="500" fill="url(#glow-speech-spam)"/>

  <!-- decorative floating shapes -->
  <circle cx="120" cy="90"  r="60"  fill="#ffffff" opacity="0.06"/>
  <circle cx="720" cy="410" r="90"  fill="#ffffff" opacity="0.05"/>
  <circle cx="680" cy="120" r="30"  fill="#ffffff" opacity="0.10"/>

  <!-- glyph disc, centered on the right -->
  <g transform="translate(500 130) scale(1.35)">
    <circle cx="100" cy="100" r="105" fill="#000" opacity="0.15"/>
    
    <rect x="35" y="85" width="6" height="30" rx="3" fill="#fff" opacity="0.9"/><rect x="45" y="75" width="6" height="50" rx="3" fill="#fff" opacity="0.9"/><rect x="55" y="65" width="6" height="70" rx="3" fill="#fff" opacity="0.9"/><rect x="65" y="55" width="6" height="90" rx="3" fill="#fff" opacity="0.9"/><rect x="75" y="70" width="6" height="60" rx="3" fill="#fff" opacity="0.9"/><rect x="85" y="80" width="6" height="40" rx="3" fill="#fff" opacity="0.9"/><rect x="95" y="60" width="6" height="80" rx="3" fill="#fff" opacity="0.9"/><rect x="105" y="50" width="6" height="100" rx="3" fill="#fff" opacity="0.9"/><rect x="115" y="67.5" width="6" height="65" rx="3" fill="#fff" opacity="0.9"/><rect x="125" y="77.5" width="6" height="45" rx="3" fill="#fff" opacity="0.9"/><rect x="135" y="85" width="6" height="30" rx="3" fill="#fff" opacity="0.9"/><rect x="145" y="70" width="6" height="60" rx="3" fill="#fff" opacity="0.9"/><rect x="155" y="80" width="6" height="40" rx="3" fill="#fff" opacity="0.9"/><rect x="165" y="87.5" width="6" height="25" rx="3" fill="#fff" opacity="0.9"/>
  </g>

  <!-- text plate on the left -->
  <g font-family="'Space Grotesk','Inter',system-ui,sans-serif">
    <text x="60" y="240" fill="#0b0b12" opacity="0.85" font-size="14" letter-spacing="4">SAQLAINAP · ARENA</text>
    <text x="60" y="300" fill="#ffffff" font-size="56" font-weight="700">Speech Spam</text>
    <text x="60" y="345" fill="#ffffff" opacity="0.85" font-size="22">realtime voice classifier</text>
    <rect x="60" y="370" width="80" height="5" rx="2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>