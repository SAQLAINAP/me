    <script>
      // Companion to 404.html — decode the ?p=/route&q=... query the GitHub
      // Pages fallback rewrites into a real SPA URL before React boots.
      (function () {
        var l = window.location;
        if (l.search && l.search.indexOf('?p=/') === 0) {
          var q = l.search.slice(1).split('&').reduce(function (acc, kv) {
            var pair = kv.split('=');
            acc[pair[0]] = pair.slice(1).join('=');
            return acc;
          }, {});
          if (q.p !== undefined) {
            var newUrl =
              l.pathname.replace(/\/$/, '') +
              '/' + q.p.replace(/^\//, '').replace(/~and~/g, '&') +
              (q.q ? '?' + q.q.replace(/~and~/g, '&') : '') +
              l.hash;
            window.history.replaceState(null, '', newUrl);
          }
        }
      })();
    </script>
