<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g-foundermap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbd535"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid-foundermap" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#14160d" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#g-foundermap)"/>
  <rect width="800" height="500" fill="url(#grid-foundermap)"/>

  <!-- founder-match graph on the right -->
  <g transform="translate(470 80)" stroke="#14160d" stroke-width="3">
    <!-- edges -->
    <g stroke-dasharray="6 4" opacity="0.85">
      <line x1="140" y1="60"  x2="60"  y2="180"/>
      <line x1="140" y1="60"  x2="240" y2="180"/>
      <line x1="60"  y1="180" x2="140" y2="300"/>
      <line x1="240" y1="180" x2="140" y2="300"/>
      <line x1="60"  y1="180" x2="240" y2="180"/>
      <line x1="140" y1="60"  x2="140" y2="300"/>
    </g>
    <!-- nodes -->
    <g>
      <circle cx="140" cy="60"  r="34" fill="#fff4ec"/>
      <text x="140" y="68" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="28" font-weight="700" fill="#14160d" stroke="none">A</text>
    </g>
    <g>
      <circle cx="60"  cy="180" r="34" fill="#d1e030"/>
      <text x="60" y="188" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="28" font-weight="700" fill="#14160d" stroke="none">B</text>
    </g>
    <g>
      <circle cx="240" cy="180" r="34" fill="#9eef80"/>
      <text x="240" y="188" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="28" font-weight="700" fill="#14160d" stroke="none">C</text>
    </g>
    <g>
      <circle cx="140" cy="300" r="40" fill="#f97316"/>
      <text x="140" y="309" text-anchor="middle" font-family="'Oswald',sans-serif" font-size="32" font-weight="700" fill="#14160d" stroke="none">D</text>
    </g>
    <!-- match indicator -->
    <g transform="translate(200 300)" stroke="none">
      <rect x="0" y="0" width="80" height="26" fill="#14160d"/>
      <text x="40" y="18" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#fbd535">MATCH 92%</text>
    </g>
  </g>

  <!-- text plate -->
  <g font-family="'Oswald','Arial Narrow',Impact,sans-serif">
    <text x="60" y="220" fill="#14160d" opacity="0.75" font-size="14" letter-spacing="4" font-family="'JetBrains Mono',monospace">SAQLAINAP · ARENA</text>
    <text x="60" y="290" fill="#14160d" font-size="70" font-weight="700">FOUNDERMAP</text>
    <text x="60" y="330" fill="#14160d" opacity="0.9" font-size="22" font-family="'JetBrains Mono',monospace">co-founder matching graph</text>
    <rect x="60" y="360" width="80" height="5" fill="#14160d"/>
  </g>
</svg>
