<?xml version="1.0" encoding="UTF-8"?>
<!-- Pixel frame 4 — black sweatshirt, lake + palm-trees backdrop -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges" preserveAspectRatio="xMidYMid meet">
  <!-- sky -->
  <rect width="24" height="24" fill="#a9c9d8"/>
  <!-- lake band -->
  <rect x="0" y="14" width="24" height="3" fill="#4b8ea8"/>
  <rect x="0" y="16" width="24" height="1" fill="#3a728a" opacity="0.7"/>
  <!-- palm trunks + fronds -->
  <g fill="#3a5a2c">
    <rect x="1"  y="6" width="1" height="9"/>
    <rect x="4"  y="4" width="1" height="11"/>
    <rect x="20" y="5" width="1" height="10"/>
    <rect x="23" y="7" width="1" height="8"/>
  </g>
  <g fill="#5a8038">
    <rect x="0"  y="5"  width="4" height="1"/>
    <rect x="2"  y="4"  width="2" height="1"/>
    <rect x="3"  y="3"  width="3" height="1"/>
    <rect x="5"  y="4"  width="2" height="1"/>
    <rect x="19" y="6"  width="4" height="1"/>
    <rect x="18" y="5"  width="2" height="1"/>
    <rect x="21" y="5"  width="3" height="1"/>
    <rect x="22" y="4"  width="2" height="1"/>
    <rect x="19" y="4"  width="2" height="1"/>
  </g>

  <!-- hair -->
  <g fill="#1a1a12">
    <rect x="6"  y="3" width="12" height="1"/>
    <rect x="5"  y="4" width="14" height="1"/>
    <rect x="4"  y="5" width="16" height="2"/>
    <rect x="4"  y="7" width="2"  height="2"/>
    <rect x="18" y="7" width="2"  height="2"/>
  </g>
  <g fill="#3a3a25">
    <rect x="7"  y="4" width="1" height="1"/>
    <rect x="11" y="3" width="1" height="1"/>
    <rect x="15" y="4" width="1" height="1"/>
  </g>

  <!-- face -->
  <g fill="#c8875a">
    <rect x="6"  y="7"  width="12" height="1"/>
    <rect x="5"  y="8"  width="14" height="1"/>
    <rect x="5"  y="9"  width="14" height="1"/>
    <rect x="5"  y="10" width="14" height="1"/>
    <rect x="5"  y="11" width="14" height="1"/>
    <rect x="5"  y="12" width="14" height="1"/>
    <rect x="6"  y="13" width="12" height="1"/>
    <rect x="7"  y="14" width="10" height="1"/>
    <rect x="8"  y="15" width="8"  height="1"/>
  </g>
  <g fill="#a06d43" opacity="0.55">
    <rect x="17" y="8"  width="2" height="7"/>
  </g>

  <!-- eyebrows + eyes (no glasses) -->
  <g fill="#1a1a12">
    <rect x="7"  y="8" width="4" height="1"/>
    <rect x="13" y="8" width="4" height="1"/>
    <rect x="8"  y="10" width="2" height="1"/>
    <rect x="14" y="10" width="2" height="1"/>
  </g>
  <!-- neutral gaze mouth -->
  <g fill="#5a3520">
    <rect x="10" y="14" width="4" height="1"/>
  </g>
  <!-- stubble -->
  <g fill="#2a1c12" opacity="0.45">
    <rect x="9"  y="15" width="6" height="1"/>
  </g>

  <!-- neck -->
  <g fill="#a06d43">
    <rect x="10" y="16" width="4" height="1"/>
  </g>

  <!-- black crew-neck sweatshirt -->
  <g fill="#14160d">
    <rect x="3"  y="17" width="18" height="7"/>
  </g>
  <!-- crew collar rib -->
  <g fill="#2a2a1f">
    <rect x="9"  y="17" width="6" height="1"/>
  </g>
  <!-- subtle chest fold hint -->
  <g fill="#2a2a1f" opacity="0.55">
    <rect x="11" y="20" width="2" height="4"/>
  </g>

  <!-- outline pass -->
  <g fill="#14160d">
    <rect x="6"  y="2" width="12" height="1"/>
    <rect x="5"  y="3" width="1" height="1"/>
    <rect x="18" y="3" width="1" height="1"/>
    <rect x="4"  y="4" width="1" height="1"/>
    <rect x="19" y="4" width="1" height="1"/>
    <rect x="3"  y="5" width="1" height="2"/>
    <rect x="20" y="5" width="1" height="2"/>
    <rect x="4"  y="7" width="1" height="6"/>
    <rect x="19" y="7" width="1" height="6"/>
    <rect x="5"  y="13" width="1" height="1"/>
    <rect x="18" y="13" width="1" height="1"/>
    <rect x="6"  y="14" width="1" height="1"/>
    <rect x="17" y="14" width="1" height="1"/>
    <rect x="7"  y="15" width="1" height="1"/>
    <rect x="16" y="15" width="1" height="1"/>
    <rect x="8"  y="16" width="2" height="1"/>
    <rect x="14" y="16" width="2" height="1"/>
  </g>
</svg>
